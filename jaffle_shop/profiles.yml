# dbt connection profile for the training.
#
# This project runs entirely on DuckDB — an embedded database stored in a single
# local file inside your codespace. There are NO credentials, tokens or cloud
# warehouses to configure: everything works out of the box.
#
# dbt picks this file up automatically because it sits next to dbt_project.yml.
duckdb_dev:
  target: dev
  outputs:
    dev:
      type: duckdb
      # The database lives in one file in this folder (jaffle_shop.duckdb). The
      # path is relative to where you run dbt from, so run dbt from inside the
      # jaffle_shop folder.
      path: jaffle_shop.duckdb
      # Schema your own models build into. Override with DBT_SCHEMA if you want
      # an isolated schema (e.g. to compare your work with a colleague's).
      schema: "{{ env_var('DBT_SCHEMA', 'dbt_dev') }}"
      threads: 4
      # DuckDB lets one process write to the file, OR several read it — never
      # both. The two settings below stop that turning into "kill the process".
      #
      # Release the database file as soon as dbt is done with it. Without this,
      # a long-running dbt process (the dbt Power User extension keeps one alive
      # for as long as VS Code is open) holds the file forever and your terminal
      # `dbt run` cannot get in.
      keep_open: false
      # If something else does hold the file, wait for it instead of failing.
      # dbt backs off 1s, 2s, 4s, 8s, 16s, 32s between attempts — about a minute
      # in total, then a real error. Don't raise this much: attempt 10 would
      # wait ~17 minutes and dbt would just look frozen.
      retries:
        connect_attempts: 6
        retryable_exceptions: ["IOException"]
